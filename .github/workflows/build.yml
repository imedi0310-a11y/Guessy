name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter --version
          flutter create . --platforms=android --org com.dzd --project-name guessy
          sed -i 's/android:label="guessy"/android:label="Guessy"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' $M
          if grep -q '<queries>' $M; then
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.speech.RecognitionService" /></intent>#' $M
          else
            sed -i 's#</manifest>#    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n</manifest>#' $M
          fi
          cat $M
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          MA=$(find android/app/src/main -name MainActivity.kt | head -1); echo $MA
          cp ci/kotlin/MainActivity.kt $MA
          G=$(ls android/app/build.gradle*); echo $G
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("debug")\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' $G
          grep -n -A3 'release {' $G

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          for w in Regular Medium Bold ExtraBold Black; do
            curl -sSfL -o assets/fonts/Tajawal-$w.ttf https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-$w.ttf
          done
          ls -la assets/fonts

      - name: Fetch card photos (Wikipedia)
        run: |
          pip install --quiet pillow
          python3 scripts/fetch_images.py || echo '{}' > assets/data/images.json
          du -sh assets/photos; ls assets/photos | wc -l

      - name: Get packages + app icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze (errors become annotations)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings --format=machine 2> analyze.txt || true
          cat analyze.txt
          grep '^ERROR' analyze.txt | awk -F'|' '{ f=$4; sub(/.*\/guessy\//,"",f); printf "::error file=%s,line=%s,col=%s::%s\n", f, $5, $6, $8 }' || true
          if grep -q '^ERROR' analyze.txt; then exit 1; fi

      - name: Run tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt || { grep -v '^\s*$' test.txt | tail -c 7000 | python3 -c "import sys;d=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A');print('::error title=tests::'+d)"; exit 1; }

      - name: Design screenshots
        continue-on-error: true
        run: |
          flutter test screenshot/shots_test.dart --update-goldens || true
          ls screenshot/goldens || true

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Guessy.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Guessy-old-phones.apk
          ls -la *.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Guessy build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: |
            Guessy.apk
            Guessy-old-phones.apk
            screenshot/goldens/*.png
          body: |
            Download **Guessy.apk** (most phones). Use Guessy-old-phones.apk only if the first one doesn't install.
